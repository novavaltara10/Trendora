<!DOCTYPE html>
<html>
<head>
  <title>Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Poppins, sans-serif;
      background: #f5f5f5;
      margin: 0;
    }

    .navbar {
      background: #0f1111;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      padding: 15px;
    }

    .box {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .payment {
      display: flex;
      gap: 10px;
    }

    .payment button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #ddd;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }

    .total {
      font-weight: bold;
      margin-top: 10px;
    }

    .place-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, orange, red);
      border: none;
      color: white;
      border-radius: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="navbar">
  <h2>Checkout 🧾</h2>
</div>

<div class="container">

  <!-- 🛒 Order Summary -->
  <div class="box">
    <h3>Order Summary</h3>
    <div id="order-items"></div>
    <div id="total" class="total"></div>
  </div>

  <!-- 👤 User Details -->
  <div class="box">
    <h3>Shipping Details</h3>
    <input type="text" placeholder="Full Name">
    <input type="text" placeholder="Address">
    <input type="text" placeholder="Phone Number">
  </div>

  <!-- 💳 Payment -->
  <div class="box">
    <h3>Payment Method</h3>
    <div class="payment">
      <button>UPI</button>
      <button>Card</button>
      <button>COD</button>
    </div>
  </div>

  <!-- 🚀 Place Order -->
  <button class="place-btn" onclick="placeOrder()">Place Order</button>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let output = "";
let total = 0;

cart.forEach(item => {
  output += `<div class="order-item">
               <span>${item.name}</span>
               <span>₹${item.price}</span>
             </div>`;
  total += item.price;
});

document.getElementById("order-items").innerHTML = output;
document.getElementById("total").innerText = "Total: ₹" + total;

function placeOrder() {
  localStorage.removeItem("cart");
  window.location.href = "success.html";
}
</script>

</body>
</html>
