<!DOCTYPE html>
<html>
<head>
  <title>Trendora</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Poppins, sans-serif;
      background: #f5f5f5;
    }

    /* 🔥 NAVBAR */
    .navbar {
      background: #0f1111;
      color: white;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar h2 {
      margin: 0;
    }

    .nav-links a {
      color: white;
      margin-left: 10px;
      text-decoration: none;
    }

    /* 🔍 SEARCH */
    .search-box {
      display: flex;
      padding: 10px;
      background: #232f3e;
    }

    .search-box input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }

    /* 🎯 HERO */
    .hero {
      background: linear-gradient(to right, #ff7e5f, #feb47b);
      color: white;
      padding: 40px 20px;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: 28px;
    }

    .hero button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
    }

    /* 🛍️ PRODUCTS */
    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .card {
      background: white;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 8px;
    }

    .card h3 {
      margin: 5px 0;
    }

    .card p {
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- 🔥 NAVBAR -->
<div class="navbar">
  <h2>Trendora 🛍️</h2>
  <div class="nav-links">
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
  </div>
</div>

<!-- 🔍 SEARCH -->
<div class="search-box">
  <input type="text" placeholder="Search Trendora...">
</div>

<!-- 🎯 HERO -->
<div class="hero">
  <h1>Big Sale is Live 🔥</h1>
  <p>Up to 50% OFF on all products</p>
  <a href="products.html">
    <button>Shop Now</button>
  </a>
</div>

<!-- 🛍️ PRODUCTS PREVIEW -->
<div class="products">

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Shoes</h3>
    <p>₹999</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Watch</h3>
    <p>₹1499</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Headphones</h3>
    <p>₹1999</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Bag</h3>
    <p>₹799</p>
  </div>

</div>

</body>
  </html>
