<!DOCTYPE html>
<html>
<head>
  <title>Products</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Poppins, sans-serif;
      background: #f5f5f5;
    }

    /* 🔥 NAVBAR */
    .navbar {
      background: #0f1111;
      color: white;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-links a {
      color: white;
      margin-left: 10px;
      text-decoration: none;
    }

    /* 🔍 SEARCH */
    .search-box {
      display: flex;
      padding: 10px;
      background: #232f3e;
    }

    .search-box input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }

    /* 🛍️ PRODUCTS */
    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 12px;
    }

    .card {
      background: white;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .card h3 {
      margin: 8px 0;
    }

    .card p {
      font-weight: bold;
      margin: 5px 0;
    }

    .card button {
      margin-top: 8px;
      padding: 8px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: linear-gradient(to right, orange, red);
      color: white;
    }
  </style>
</head>

<body>

<!-- 🔥 NAVBAR -->
<div class="navbar">
  <h2>Trendora 🛍️</h2>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="cart.html">Cart</a>
  </div>
</div>

<!-- 🔍 SEARCH -->
<div class="search-box">
  <input type="text" id="search" placeholder="Search products..." onkeyup="searchProduct()">
</div>

<!-- 🛍️ PRODUCTS -->
<div class="products">

<div class="card">
  <img src="https://via.placeholder.com/200">
  <h3>Shoes</h3>
  <p>₹999</p>
  <button onclick="addToCart('Shoes', 999)">Add to Cart</button>
</div>

<div class="card">
  <img src="https://via.placeholder.com/200">
  <h3>Headphones</h3>
  <p>₹1999</p>
  <button onclick="addToCart('Headphones', 1999)">Add to Cart</button>
</div>

<div class="card">
  <img src="https://via.placeholder.com/200">
  <h3>Watch</h3>
  <p>₹1499</p>
  <button onclick="addToCart('Watch', 1499)">Add to Cart</button>
</div>

<div class="card">
  <img src="https://via.placeholder.com/200">
  <h3>Bag</h3>
  <p>₹799</p>
  <button onclick="addToCart('Bag', 799)">Add to Cart</button>
</div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name, price) {
  cart.push({ name, price });
  localStorage.setItem("cart", JSON.stringify(cart));
  alert(name + " added to cart 🛒");
}

function searchProduct() {
  let input = document.getElementById("search").value.toLowerCase();
  let cards = document.querySelectorAll(".card");

  cards.forEach(card => {
    let title = card.querySelector("h3").innerText.toLowerCase();

    if (title.includes(input)) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}
</script>

</body>
</html>
