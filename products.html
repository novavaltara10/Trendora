<!DOCTYPE html>
<html>
<head>
  <title>Products</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Poppins, sans-serif;
      background: #f5f5f5;
    }
.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.3);
}

button:hover {
  transform: scale(1.08);
    }
    .navbar {
      background: #0f1111;
      color: white;
      padding: 12px;
      display: flex;
      justify-content: space-between;
    }

    .navbar a {
      color: white;
      margin-left: 10px;
      text-decoration: none;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 12px;
    }

    .card {
      background: white;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    button {
      margin-top: 8px;
      padding: 8px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: linear-gradient(to right, orange, red);
      color: white;
    }
  </style>
</head>

<body>

<div class="navbar">
  <h2>Trendora 🛍️</h2>
  <div>
    <a href="index.html">Home</a>
    <a href="cart.html">Cart</a>
  </div>
</div>

<div class="products">

<div class="card" onclick="openProduct('Shoes', 999)">
  <img src="https://via.placeholder.com/200">
  <h3>Shoes</h3>
  <p>₹999</p>
  <button onclick="event.stopPropagation(); addToCart('Shoes',999)">Add to Cart</button>
</div>

<div class="card" onclick="openProduct('Headphones', 1999)">
  <img src="https://via.placeholder.com/200">
  <h3>Headphones</h3>
  <p>₹1999</p>
  <button onclick="event.stopPropagation(); addToCart('Headphones',1999)">Add to Cart</button>
</div>

<div class="card" onclick="openProduct('Watch', 1499)">
  <img src="https://via.placeholder.com/200">
  <h3>Watch</h3>
  <p>₹1499</p>
  <button onclick="event.stopPropagation(); addToCart('Watch',1499)">Add to Cart</button>
</div>

<div class="card" onclick="openProduct('Bag', 799)">
  <img src="https://via.placeholder.com/200">
  <h3>Bag</h3>
  <p>₹799</p>
  <button onclick="event.stopPropagation(); addToCart('Bag',799)">Add to Cart</button>
</div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name, price) {
  cart.push({ name, price });
  localStorage.setItem("cart", JSON.stringify(cart));
  alert(name + " added to cart 🛒");
}

function openProduct(name, price) {
  window.location.href = `product-detail.html?name=${name}&price=${price}`;
}
</script>

</body>
  </html>
